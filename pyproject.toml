# Tool settings only (Nestwork isn't packaged). Run everything with: ./run.sh check
[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# Real mistakes only: undefined names, unused imports/variables, syntax errors, invalid escapes.
select = ["F", "E9", "W6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
